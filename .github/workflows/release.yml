name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to release'
        required: true
        type: choice
        options:
          - vscode
          - intellij
          - both
        default: 'both'
      vscode_version:
        description: 'VS Code version (leave empty for current version in package.json)'
        required: false
        type: string
        default: ''
      intellij_version:
        description: 'IntelliJ version (leave empty for current version in gradle.properties)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # Build the shared debug server JAR (used by both platforms)
  build-debug-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug-server JAR
        run: |
          cd shared/debug-server
          mvn clean package -q

      - name: Upload debug-server JAR
        uses: actions/upload-artifact@v6
        with:
          name: debug-server-jar
          path: shared/debug-server/target/karate-debug-server-1.0.0.jar

  # VS Code Extension Release
  release-vscode:
    needs: build-debug-server
    if: ${{ github.event.inputs.platform == 'vscode' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download debug-server JAR
        uses: actions/download-artifact@v7
        with:
          name: debug-server-jar
          path: vscode/resources/

      - name: Update version (if specified)
        if: ${{ github.event.inputs.vscode_version != '' }}
        working-directory: vscode
        run: npm version ${{ github.event.inputs.vscode_version }} --no-git-tag-version

      - name: Get version
        id: version
        working-directory: vscode
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Compile TypeScript
        working-directory: vscode
        run: npm run compile

      - name: Package extension
        working-directory: vscode
        run: npx vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        working-directory: vscode
        run: npx vsce publish --no-dependencies -p ${{ secrets.AZUREPAT }}

      - name: Upload VS Code artifact
        uses: actions/upload-artifact@v6
        with:
          name: vscode-extension
          path: vscode/*.vsix

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

  # IntelliJ Plugin Release
  release-intellij:
    needs: build-debug-server
    if: ${{ github.event.inputs.platform == 'intellij' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          BEFORE=$(df / | tail -1 | awk '{print $4}')
          echo ""
          echo "Removing Android SDK, .NET, Haskell, and other large tools..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo ""
          echo "=== After cleanup ==="
          df -h /
          AFTER=$(df / | tail -1 | awk '{print $4}')
          echo ""
          echo "Disk space: $BEFORE -> $AFTER"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download debug-server JAR
        uses: actions/download-artifact@v7
        with:
          name: debug-server-jar
          path: shared/debug-server/target/

      - name: Copy JAR to IntelliJ resources
        run: cp shared/debug-server/target/karate-debug-server-1.0.0.jar intellij/src/main/resources/

      - name: Update version (if specified)
        if: ${{ github.event.inputs.intellij_version != '' }}
        working-directory: intellij
        run: |
          sed -i "s/pluginVersion = .*/pluginVersion = ${{ github.event.inputs.intellij_version }}/" gradle.properties

      - name: Get version
        id: version
        working-directory: intellij
        run: echo "VERSION=$(grep 'pluginVersion' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Build plugin
        working-directory: intellij
        run: ./gradlew buildPlugin

      - name: Verify plugin
        working-directory: intellij
        run: ./gradlew verifyPlugin

      - name: Sign plugin
        working-directory: intellij
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      - name: Publish to JetBrains Marketplace
        working-directory: intellij
        env:
          JETBRAINS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Upload IntelliJ artifact
        uses: actions/upload-artifact@v6
        with:
          name: intellij-plugin
          path: intellij/build/distributions/*-signed.zip

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

  # Create GitHub Release for VS Code
  create-vscode-release:
    needs: [release-vscode]
    if: ${{ needs.release-vscode.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download VS Code artifact
        uses: actions/download-artifact@v7
        with:
          name: vscode-extension
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vscode-v${{ needs.release-vscode.outputs.version }}
          name: VS Code Extension v${{ needs.release-vscode.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create GitHub Release for IntelliJ
  create-intellij-release:
    needs: [release-intellij]
    if: ${{ needs.release-intellij.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download IntelliJ artifact
        uses: actions/download-artifact@v7
        with:
          name: intellij-plugin
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: intellij-v${{ needs.release-intellij.outputs.version }}
          name: IntelliJ Plugin v${{ needs.release-intellij.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
