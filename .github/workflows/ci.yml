name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build the shared debug server JAR (used by both platforms)
  build-debug-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug-server JAR
        run: |
          cd shared/debug-server
          mvn clean package -q

      - name: Upload debug-server JAR
        uses: actions/upload-artifact@v6
        with:
          name: debug-server-jar
          path: shared/debug-server/target/karate-debug-server-1.0.0.jar

  # VS Code Extension Build
  build-vscode:
    needs: build-debug-server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download debug-server JAR
        uses: actions/download-artifact@v7
        with:
          name: debug-server-jar
          path: vscode/resources/

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Lint TypeScript
        working-directory: vscode
        run: npm run lint

      - name: Run tests
        working-directory: vscode
        run: xvfb-run -a npm test

      - name: Compile TypeScript
        working-directory: vscode
        run: npm run compile

      - name: Package extension
        working-directory: vscode
        run: npx vsce package --no-dependencies

  # IntelliJ Plugin Build
  build-intellij:
    needs: build-debug-server
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          BEFORE=$(df / | tail -1 | awk '{print $4}')
          echo ""
          echo "Removing Android SDK, .NET, Haskell, and other large tools..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo ""
          echo "=== After cleanup ==="
          df -h /
          AFTER=$(df / | tail -1 | awk '{print $4}')
          echo ""
          echo "Disk space: $BEFORE -> $AFTER"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download debug-server JAR
        uses: actions/download-artifact@v7
        with:
          name: debug-server-jar
          path: shared/debug-server/target/

      - name: Copy JAR to IntelliJ resources
        run: cp shared/debug-server/target/karate-debug-server-1.0.0.jar intellij/src/main/resources/

      - name: Build plugin
        working-directory: intellij
        run: ./gradlew buildPlugin

      - name: Verify plugin
        working-directory: intellij
        run: ./gradlew verifyPlugin

      - name: Add versions to summary
        working-directory: intellij
        run: |
          echo "## IntelliJ Plugin Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "| IDE | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| IntelliJ IDEA Community | 2023.1 |" >> $GITHUB_STEP_SUMMARY
          echo "| IntelliJ IDEA Community | 2024.2 |" >> $GITHUB_STEP_SUMMARY
          echo "| IntelliJ IDEA Community | 2024.3 |" >> $GITHUB_STEP_SUMMARY
          echo "| IntelliJ IDEA Community | 2025.1 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Compatibility Range" >> $GITHUB_STEP_SUMMARY
          UNTIL_BUILD=$(unzip -p build/distributions/*.zip '*/plugin.xml' | grep -oP 'until-build="\K[^"]+')
          SINCE_BUILD=$(unzip -p build/distributions/*.zip '*/plugin.xml' | grep -oP 'since-build="\K[^"]+')
          echo "- **Since Build:** $SINCE_BUILD (IntelliJ 2023.1+)" >> $GITHUB_STEP_SUMMARY
          echo "- **Until Build:** $UNTIL_BUILD" >> $GITHUB_STEP_SUMMARY

