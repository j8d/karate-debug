name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build the shared debug server JAR (used by both platforms)
  build-debug-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug-server JAR
        run: |
          cd shared/debug-server
          mvn clean package -q

      - name: Upload debug-server JAR
        uses: actions/upload-artifact@v6
        with:
          name: debug-server-jar
          path: shared/debug-server/target/karate-debug-server-1.0.0.jar

  # VS Code Extension Build
  build-vscode:
    needs: build-debug-server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download debug-server JAR
        uses: actions/download-artifact@v7
        with:
          name: debug-server-jar
          path: vscode/resources/

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Lint TypeScript
        working-directory: vscode
        run: npm run lint

      - name: Run tests
        working-directory: vscode
        run: xvfb-run -a npm test

      - name: Compile TypeScript
        working-directory: vscode
        run: npm run compile

      - name: Package extension
        working-directory: vscode
        run: npx vsce package --no-dependencies

  # IntelliJ Plugin Build
  build-intellij:
    needs: build-debug-server
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download debug-server JAR
        uses: actions/download-artifact@v7
        with:
          name: debug-server-jar
          path: shared/debug-server/target/

      - name: Copy JAR to IntelliJ resources
        run: cp shared/debug-server/target/karate-debug-server-1.0.0.jar intellij/src/main/resources/

      - name: Build plugin
        working-directory: intellij
        run: ./gradlew buildPlugin

      - name: Verify plugin
        working-directory: intellij
        run: ./gradlew verifyPlugin

