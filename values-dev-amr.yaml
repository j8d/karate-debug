replicaCount: 1

ingress:
  enabled: true

service:
  enabled: true
  port: 8080
  targetPort: 8080

deployment:
  enabled: true
  target: "ec2" #Enable deployment to EC2
  resources:
    limits:
      memory: '512Mi'
      cpu: 0.5
    requests:
      memory: '512Mi'
      cpu: 0.2
  startupProbe:
    enabled: true
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
    initialDelaySeconds: 60
    httpGet:
      path: '/hello'
  readinessProbe:
    enabled: true
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
    initialDelaySeconds: 60
    httpGet:
      path: '/hello'
  livenessProbe:
    enabled: true
    failureThreshold: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
    initialDelaySeconds: 60
    httpGet:
      path: '/hello'

emptyDirVolumes:
  enabled: true
  volumes:
    - name: tmp
      mountPath: /tmp