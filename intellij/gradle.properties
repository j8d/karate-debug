# IntelliJ Platform Plugin Configuration
pluginGroup = com.j8d.karate-debug
pluginName = Karate Debug
pluginVersion = 0.1.3

# IntelliJ Platform version to build against
# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
platformType = IC
platformVersion = 2025.1.1

# Plugin Verifier integration - test against multiple versions
# These should match the sinceBuild/untilBuild range in build.gradle.kts
pluginVerifierIdeVersions = IC-2024.2.4, IC-2024.3.4, IC-2025.1.1

# Gradle configuration
org.gradle.jvmargs = -Xmx2g
org.gradle.parallel = true

# Kotlin JVM target
kotlin.stdlib.default.dependency = false

