# IntelliJ Platform Plugin Configuration
pluginGroup = com.j8d.karate.intellij
pluginName = Karate Debug
pluginVersion = 0.1.0

# IntelliJ Platform version to build against
# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
platformType = IC
platformVersion = 2024.2.4

# Plugin Verifier integration - test against multiple versions
pluginVerifierIdeVersions = 2023.2.8, 2023.3.8, 2024.1.7, 2024.2.4

# Gradle configuration
org.gradle.jvmargs = -Xmx2g
org.gradle.parallel = true

# Kotlin JVM target
kotlin.stdlib.default.dependency = false

